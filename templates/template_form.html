{% extends 'base.html' %}{% block content %}<div class="card form-card"><h1>{{'編輯範本' if template else '新增公文範本'}}</h1><p class="hint">可使用 {{'{{工程名稱}}'}}、{{'{{受文者}}'}}、{{'{{發文日期}}'}}、{{'{{民國年}}'}}、{{'{{月份}}'}}、{{'{{快速內容}}'}}。</p><form method="post"><div class="form-grid"><label class="wide">範本名稱<input required name="name" value="{{template.name if template else ''}}" placeholder="例如：材料送審、月報表、計畫書審查"></label><label class="wide">主旨<textarea name="subject" rows="3">{{template.subject if template else ''}}</textarea></label><label class="wide">說明<textarea name="explanation" rows="7">{{template.explanation if template else ''}}</textarea></label><label class="wide">附件<input name="attachment" value="{{template.attachment if template else ''}}"></label><label>正本<input name="originals" value="{{template.originals if template else '{{受文者}}'}}"></label><label>副本<input name="copies" value="{{template.copies if template else ''}}"></label><label class="wide check"><input type="checkbox" name="quick_enabled" {% if template and template.quick_enabled %}checked{% endif %}> 啟用「快速按鈕」</label><label class="wide">快速按鈕（用逗號分隔）<input name="quick_buttons" value="{{template.quick_buttons if template else '廠商證明文件,規格樣式,試驗報告,防火證明,型錄,出廠證明'}}"></label></div><div class="actions"><a class="btn" href="{{url_for('index')}}">取消</a><button class="btn primary">儲存範本</button></div></form></div>{% endblock %}
