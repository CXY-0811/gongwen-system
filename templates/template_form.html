{% extends 'base.html' %}{% block content %}<div class="card form-card"><h1>{{'編輯' if template else '新增'}}公文範本</h1><p class="hint">可使用 {{工程名稱}}、{{受文者}}、{{月份}} 等變數；自己輸入的新變數會在產生公文時變成填寫欄位。材料清單請使用 {{材料清單}}。</p><form method="post"><div class="form-grid"><label class="wide">範本名稱<input name="name" required value="{{template.name if template else ''}}" placeholder="例如：月報表、材料送審、計畫書審查"></label><label class="wide">主旨範本<textarea name="subject_template" rows="4">{{template.subject_template if template else ''}}</textarea></label><label class="wide">說明範本<textarea name="explanation_template" rows="8">{{template.explanation_template if template else ''}}</textarea></label><label class="wide">附件範本<input name="attachment_template" value="{{template.attachment_template if template else ''}}"></label><label>正本範本<input name="originals_template" value="{{template.originals_template if template else '{{受文者}}'}}"></label><label>副本範本<input name="copies_template" value="{{template.copies_template if template else ''}}"></label><label class="wide check"><input type="checkbox" name="use_material_builder" {% if template and template.use_material_builder %}checked{% endif %}> 啟用「材料送審快速填寫」</label><label class="wide">材料快速按鈕（用逗號分隔）<input name="quick_options" value="{{template.quick_options if template else '廠商證明文件,規格樣式,試驗報告,防火證明,型錄,出廠證明'}}"></label></div><div class="actions"><a class="btn" href="{{url_for('index')}}">取消</a><button class="btn primary">儲存範本</button></div></form></div>{% endblock %}
