{% extends 'base.html' %}{% block content %}{% set x=prefill or {} %}<div class="card form-card"><h1>{{'編輯公文' if doc else '建立公文'}}</h1><form method="post" action="{{url_for('document_edit',did=doc.id) if doc else url_for('document_save')}}"><div class="form-grid"><label>專案<select name="project_id" required><option value="{{project.id}}">{{project.name}}</option></select></label><label>發文日期<input type="date" name="doc_date" value="{{doc_date}}" required></label><label>流水號<input name="serial" value="{{serial}}" required></label><label>受文者<input name="recipient" value="{{doc.recipient if doc else x.get('recipient',project.default_recipient)}}"></label><label>速別<input name="speed" value="{{doc.speed if doc else x.get('speed',project.speed)}}"></label><label>密等及解密條件<input name="security" value="{{doc.security if doc else x.get('security',project.security)}}"></label><label class="wide">附件<input name="attachment" value="{{doc.attachment if doc else x.get('attachment','')}}"></label><label class="wide">主旨<textarea name="subject" rows="3">{{doc.subject if doc else x.get('subject','')}}</textarea></label><label class="wide">說明<textarea name="explanation" rows="9">{{doc.explanation if doc else x.get('explanation','')}}</textarea></label><label>正本<input name="originals" value="{{doc.originals if doc else x.get('originals',project.default_recipient)}}"></label><label>副本<input name="copies" value="{{doc.copies if doc else x.get('copies','')}}"></label></div><div class="hint">發文字號將依專案規則與日期自動產生。</div><div class="actions"><a class="btn" href="{{url_for('project_view',pid=project.id)}}">取消</a><button class="btn primary">儲存並預覽</button></div></form></div>{% endblock %}
