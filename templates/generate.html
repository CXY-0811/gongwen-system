{% extends 'base.html' %}{% block content %}<div class="card form-card"><h1>一鍵產生：{{template.name}}</h1><form method="post"><div class="form-grid"><label>選擇專案<select name="project_id" onchange="this.form.submit()">{% for p in projects %}<option value="{{p.id}}" {{'selected' if project and p.id==project.id else ''}}>{{p.name}}</option>{% endfor %}</select></label><label>發文日期<input type="date" name="doc_date" value="{{doc_date}}"></label><label class="wide">受文者<input name="recipient" value="{{project.default_recipient if project else ''}}"></label>{% for f in fields %}<label class="{{'wide' if f in ['備註','審查結果'] else ''}}">{{f}}<input name="var_{{f}}" placeholder="請輸入{{f}}"></label>{% endfor %}<label class="wide">附件<input name="attachment"></label></div><div class="preview-box"><b>範本主旨：</b><br>{{template.subject}}</div><div class="actions"><a class="btn" href="{{url_for('index')}}">取消</a><button class="btn primary">產生完整公文</button></div></form></div>{% endblock %}
