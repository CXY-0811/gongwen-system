{% extends 'base.html' %}{% block content %}<div class="card form-card"><h1>{{'編輯專案' if project else '新增專案'}}</h1><form method="post"><div class="form-grid"><label>專案名稱<input required name="name" value="{{project.name if project else ''}}"></label><label>發文機關／事務所<input required name="office" value="{{project.office if project else '徐英豪建築師事務所'}}"></label><label>民國年度<input required type="number" name="year" value="{{project.year if project else 115}}"></label><label>發文字號前綴<input required name="prefix" value="{{project.prefix if project else '一一五所新環字第'}}"></label><label>預設受文者<input name="default_recipient" value="{{project.default_recipient if project else ''}}"></label><label>速別<input name="speed" value="{{project.speed if project else '普通件'}}"></label><label>密等及解密條件<input name="security" value="{{project.security if project else '普通'}}"></label><label>連絡人<input name="contact" value="{{project.contact if project else ''}}"></label><label>電話<input name="phone" value="{{project.phone if project else ''}}"></label><label>傳真<input name="fax" value="{{project.fax if project else ''}}"></label><label>E-Mail<input name="email" value="{{project.email if project else ''}}"></label><label class="wide">聯絡住址<input name="address" value="{{project.address if project else ''}}"></label></div><div class="actions"><a class="btn" href="{{url_for('index')}}">取消</a><button class="btn primary">儲存專案</button></div></form></div>{% endblock %}
