services:
  - type: web
    name: gongwen-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/data.db
    disk:
      name: gongwen-data
      mountPath: /var/data
      sizeGB: 1
